
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyCulator</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #020617;
    font-family: Arial, sans-serif;
    color: white;
}

.calculator {
    width: min(350px, 94vw);
    padding: 24px;
    border-radius: 24px;
    background: #0f172a;
    box-shadow: 0 20px 60px #0008;
}

h1 {
    margin: 0 0 24px;
    text-align: center;
    font-size: 23px;
}

.expression {
    min-height: 24px;
    color: #94a3b8;
    text-align: right;
    overflow-wrap: anywhere;
}

.display {
    min-height: 70px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    overflow-wrap: anywhere;
    word-break: break-all;
    font-size: 38px;
    margin-bottom: 20px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

button {
    min-width: 0;
    height: 59px;
    border: 0;
    border-radius: 12px;
    background: #334155;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: filter .15s, transform .15s;
}

button:hover { filter: brightness(1.2); }
button:active { transform: scale(.96); }

.operator {
    background: #38bdf8;
    color: #0f172a;
}

.utility { background: #475569; }

button:focus-visible {
    outline: 2px solid white;
    outline-offset: 2px;
}
</style>
</head>
<body>
<main class="calculator">
    <h1>CyCulator</h1>
    <div class="expression" id="expression" aria-live="polite"></div>
    <div class="display" id="display" aria-live="polite">0</div>

    <div class="buttons">
        <button class="utility" data-action="clear">AC</button>
        <button class="utility" data-action="sign">+/-</button>
        <button class="utility" data-action="percent">%</button>
        <button class="operator" data-op="/">/</button>

        <button data-digit="7">7</button>
        <button data-digit="8">8</button>
        <button data-digit="9">9</button>
        <button class="operator" data-op="*">*</button>

        <button data-digit="4">4</button>
        <button data-digit="5">5</button>
        <button data-digit="6">6</button>
        <button class="operator" data-op="-">-</button>

        <button data-digit="1">1</button>
        <button data-digit="2">2</button>
        <button data-digit="3">3</button>
        <button class="operator" data-op="+">+</button>

        <button data-digit="0">0</button>
        <button data-action="decimal">.</button>
        <button class="utility" data-action="delete">DEL</button>
        <button class="operator" data-action="equals">=</button>
    </div>
</main>

<script>
const display = document.getElementById("display");
const expression = document.getElementById("expression");

let current = "0";
let first = null;
let operator = null;
let waiting = false;
let finished = false;

function render() {
    display.textContent = current;
}

function reset() {
    current = "0";
    first = null;
    operator = null;
    waiting = false;
    finished = false;
    expression.textContent = "";
    render();
}

function format(n) {
    if (!Number.isFinite(n)) return "Error";
    return String(Number(n.toPrecision(12)));
}

function digit(d) {
    if (current === "Error" || waiting || finished) {
        current = d;
        waiting = false;
        finished = false;
        if (finished) expression.textContent = "";
    } else if (current.length < 15) {
        current = current === "0" ? d : current + d;
    }
    render();
}

function chooseOperator(op) {
    if (current === "Error") reset();

    if (operator && !waiting) calculate();

    first = Number(current);
    operator = op;
    waiting = true;
    finished = false;
    expression.textContent = `${current} ${op}`;
}

function calculate() {
    if (operator === null || first === null || waiting) return;

    const second = Number(current);
    let result;

    switch (operator) {
        case "+": result = first + second; break;
        case "-": result = first - second; break;
        case "*": result = first * second; break;
        case "/":
            if (second === 0) {
                current = "Error";
                expression.textContent = "Cannot divide by zero";
                first = null;
                operator = null;
                waiting = true;
                finished = true;
                render();
                return;
            }
            result = first / second;
            break;
        default: return;
    }

    expression.textContent = `${first} ${operator} ${second} =`;
    current = format(result);
    first = null;
    operator = null;
    waiting = true;
    finished = true;
    render();
}

document.querySelector(".buttons").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;

    if (b.dataset.digit !== undefined) {
        digit(b.dataset.digit);
        return;
    }

    if (b.dataset.op) {
        chooseOperator(b.dataset.op);
        return;
    }

    switch (b.dataset.action) {
        case "clear":
            reset();
            break;
        case "decimal":
            if (current === "Error" || waiting || finished) {
                current = "0.";
                waiting = false;
                finished = false;
            } else if (!current.includes(".")) {
                current += ".";
            }
            render();
            break;
        case "delete":
            if (current === "Error" || waiting || finished) {
                current = "0";
                waiting = false;
                finished = false;
            } else {
                current = current.length > 1
                    ? current.slice(0, -1) : "0";
                if (current === "-") current = "0";
            }
            render();
            break;
        case "sign":
            if (current !== "Error" && Number(current) !== 0) {
                current = format(-Number(current));
            }
            render();
            break;
        case "percent":
            if (current !== "Error") {
                current = format(Number(current) / 100);
            }
            render();
            break;
        case "equals":
            calculate();
            break;
    }
});

document.addEventListener("keydown", e => {
    if (/^[0-9]$/.test(e.key)) digit(e.key);
    else if (e.key === ".") {
        document.querySelector('[data-action="decimal"]').click();
    } else if (["+", "-", "*", "/"].includes(e.key)) {
        chooseOperator(e.key);
    } else if (e.key === "Enter" || e.key === "=") calculate();
    else if (e.key === "Backspace") {
        document.querySelector('[data-action="delete"]').click();
    } else if (e.key === "Escape") reset();
});
</script>
</body>
</html>
